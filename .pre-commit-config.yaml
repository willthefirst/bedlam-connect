# Pre-commit configuration for code quality checks

# Vendored upstream trees keep upstream's formatting and prose style —
# see vendor/README.md. Hooks get explicit filenames, so black's own
# `extend-exclude` in pyproject.toml would not stop them here.
exclude: ^vendor/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    # Keep in sync with the black version installed via pyproject.toml so
    # pre-commit and `dev lint`/CI agree on style. Version drift caused one
    # CI flap on PR #73 — pre-commit's older black approved a file that
    # CI's newer black rejected.
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/pycqa/isort
    # Keep in sync with the isort version installed via pyproject.toml so
    # pre-commit and `dev lint`/CI agree on import ordering. Same hazard
    # as black above (PR #73 flap).
    rev: 6.0.1
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.0.1
    hooks:
      - id: autoflake
        args: [--remove-all-unused-imports, --in-place]

  - repo: https://github.com/djlint/djLint
    # Keep in sync with the djlint version installed via pyproject.toml so
    # pre-commit and `dev fmt`/`dev lint`/CI agree on template formatting.
    # Same drift hazard as black/isort above (PR #73 flap).
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-jinja
        files: ^src/(framework|domain)/templates/.*\.html$
      - id: djlint-jinja
        files: ^src/(framework|domain)/templates/.*\.html$

  - repo: local
    hooks:
      - id: title-case-check
        name: Check title case
        entry: python scripts/dev/title_case_check.py
        language: python
        files: \.(md|html|jinja|jinja2)$
        pass_filenames: true
        args: [--fix]
        # The script imports selectolax to parse HTML/Jinja files. #198
        # made the import a hard failure when missing; this declaration
        # lets pre-commit install it into the hook's isolated venv (which
        # does not see project deps from pyproject.toml).
        additional_dependencies: [selectolax]

      - id: template-imports-check
        name: Check template import boundaries
        entry: python scripts/dev/template_imports_check.py
        language: python
        files: ^src/(framework|domain)/templates/.*\.html$
        pass_filenames: true

      - id: python-cluster-imports-check
        name: Check Python cluster boundaries
        entry: python scripts/dev/python_cluster_imports_check.py
        language: python
        files: ^src/(models|schemas|repositories|logic)/.*\.py$
        pass_filenames: true

      - id: contract-form-coverage-check
        name: Check contract-form coverage
        entry: python scripts/dev/contract_form_coverage_check.py
        language: python
        # Fires on changes to form templates OR the manifest — either a
        # new uncovered form, or a manifest edit that removes coverage,
        # is what we want to catch. The script itself walks the whole
        # template tree on each invocation; the file filter is just
        # the trigger.
        files: ^(src/(framework|domain)/templates/.*\.(html|jinja|jinja2)|tests/test_contract/manifest\.py|scripts/dev/contract_form_coverage_check\.py)$
        pass_filenames: false
