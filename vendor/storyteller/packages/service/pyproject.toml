[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyteller-web"
version = "0.1.0"
description = "Self-hosted service that turns website visits into plain-language stories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.44"]

[project.scripts]
storyteller = "storyteller.cli:main"

[tool.setuptools.packages.find]
include = ["storyteller*"]
